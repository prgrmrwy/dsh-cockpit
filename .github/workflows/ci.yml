name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # server/web 通过 dist 引用 @dsh-cockpit/shared（types 指向 dist/index.d.ts，
      # dist 已被 gitignore），先构建共享包再执行类型检查/测试
      - run: pnpm --filter @dsh-cockpit/shared build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test