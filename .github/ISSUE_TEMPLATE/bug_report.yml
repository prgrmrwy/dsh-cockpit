name: Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请不要走这里，改用
        [私密漏洞报告](https://github.com/prgrmrwy/dsh-cockpit/security/advisories/new)。

        贴日志前请删掉主机名、内网地址等敏感信息。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 `./bin/cockpit start`
        2. 打开设备管理，点击 ...
        3. 观察到 ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 设备连接（SSH 隧道 / 探测 / 重连）
        - 状态聚合（事件流 / 计数）
        - 壳 UI（顶栏 / 设备管理面板）
        - 工作台 iframe
        - PWA / 离线
        - 桥接插件（dsh-cockpit-bridge）
        - 构建 / 工具链
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: "例如 22db211，或 git rev-parse --short HEAD 的输出"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: "例如 macOS 15.3 / Node 22.14 / pnpm 10.23.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: "来自 `~/.dsh-cockpit/cockpit.log` 或浏览器控制台；会自动按代码块渲染"
      render: shell
