id: T3
name: 窄屏浅色无横向溢出
description: 在 390x844 浅色主题下打开设备管理面板，检查单栏重排与页面无横向溢出。
device: mobile
parallel_group: single-live-ui
conflicts_with: [T5, T6, T7]
precondition: "视口 390x844，系统 prefers-color-scheme=light；真实数据为 host 与 lumevm 两台 READY/enabled 设备。禁止改名或删除。"
ask_user_if_blocked: false
status: blocked
blocked_reason: "agent-browser exit 127; Chrome DevTools MCP unavailable"
mock_setup:
  required: false
  status: not_needed
  scenario_id: live-two-ready
  surface: device-management-panel
  data_source: /api/devices
  evidence:
    - 用户提供的真实 3090 live-two-ready 数据事实
  enable:
    command: null
    env: null
    notes: 当前 UI scope 不使用 mock
  user_decision: null

steps:
